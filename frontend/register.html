<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng ký thành viên - PTIT Cinema</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    .register-page-bg {
      min-height: calc(100vh - 64px - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      background: linear-gradient(135deg, #003580 0%, #0054a6 50%, #0077cc 100%);
    }
    .register-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .register-logo { text-align: center; margin-bottom: 24px; }
    .register-title { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
    .register-sub   { font-size: .85rem; color: var(--text-muted); }
    .form-group  { margin-bottom: 16px; }
    .form-group label { display: block; font-size: .85rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .form-group input { width: 100%; border: 1.5px solid var(--border); border-radius: 8px; padding: 11px 14px; font-size: .9rem; outline: none; transition: .2s; }
    .form-group input:focus { border-color: var(--primary); }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }
    .checkbox-group { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 20px; font-size: .85rem; color: var(--text-muted); }
    .checkbox-group input { margin-top: 3px; }
    .btn-submit { width: 100%; background: var(--primary); color: #fff; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: 700; transition: .2s; cursor: pointer; }
    .btn-submit:hover { background: var(--primary-dark); }
    .register-footer { text-align: center; margin-top: 20px; font-size: .85rem; color: var(--text-muted); }
    .register-footer a { color: var(--primary); font-weight: 600; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-top">
      <div class="container header-inner">
        <!-- Logo -->
        <a href="index.html" class="logo">
          <div class="logo-box">
            <span class="logo-b">P</span>
            <div class="logo-text">
              <span class="logo-main">PTIT</span>
              <span class="logo-sub">CINEMA</span>
            </div>
          </div>
        </a>

        <!-- Main Nav -->
        <nav class="main-nav">
          <a href="index.html#schedule-section" class="nav-link">
            <i class="fa-solid fa-clapperboard"></i> Lịch chiếu theo rạp
          </a>
          <a href="phim.html" class="nav-link">
            <i class="fa-solid fa-film"></i> Phim
          </a>
          <a href="rap.html" class="nav-link">
            <i class="fa-solid fa-building"></i> Rạp
          </a>
          <a href="giave.html" class="nav-link">
            <i class="fa-solid fa-ticket"></i> Giá vé
          </a>
          <a href="tintuc.html" class="nav-link">
            <i class="fa-solid fa-newspaper"></i> Tin tức
          </a>
        </nav>

        <!-- Right actions -->
        <div class="header-actions">
          <button class="btn-login" onclick="window.location.href='login.html'">
            <i class="fa-regular fa-user"></i> Đăng nhập
          </button>
          <button class="btn-register active" style="background:#e8f0fe;" onclick="window.location.href='register.html'">Đăng ký</button>
        </div>
      </div>
    </div>
  </header>

  <!-- REGISTER CONTAINER -->
  <div class="register-page-bg">
    <div class="register-card">
      <div class="register-logo">
        <div class="logo-box" style="justify-content:center;margin-bottom:12px;">
          <span class="logo-b">P</span>
          <div class="logo-text">
            <span class="logo-main" style="color:var(--primary);">PTIT</span>
            <span class="logo-sub" style="color:var(--text-muted);letter-spacing:3px;">CINEMA</span>
          </div>
        </div>
        <div class="register-title">Đăng ký thành viên</div>
        <div class="register-sub">Trở thành thành viên PTIT Plus để nhận ngàn ưu đãi hấp dẫn</div>
      </div>

      <div id="reg-error" style="display:none; background:#fee2e2; border:1px solid #ef4444; color:#b91c1c; padding:10px 14px; border-radius:8px; font-size:.85rem; margin-bottom:16px;"></div>
      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Họ và tên</label>
          <input type="text" id="reg-name" placeholder="Nguyễn Văn A" required/>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Số điện thoại</label>
            <input type="tel" id="reg-phone" placeholder="0912345678" pattern="[0-9]{10}" required/>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="reg-email" placeholder="example@ptit.edu.vn" required/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" id="reg-pass" placeholder="Tối thiểu 6 ký tự" minlength="6" required/>
          </div>
          <div class="form-group">
            <label>Xác nhận mật khẩu</label>
            <input type="password" id="reg-pass-confirm" placeholder="Nhập lại mật khẩu" minlength="6" required/>
          </div>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="terms" required/>
          <label for="terms">Tôi đồng ý với các điều khoản sử dụng & chính sách của PTIT Cinema</label>
        </div>

        <button class="btn-submit" id="btn-reg-submit" type="submit">
          <i class="fa-solid fa-user-plus"></i> Tạo tài khoản
        </button>
      </form>

      <div class="register-footer">
        Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
        &nbsp;|&nbsp; <a href="index.html">← Trang chủ</a>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-bottom">
      <p>© 2026 PTIT Cinema. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const hoTen = document.getElementById('reg-name').value.trim();
      const soDienThoai = document.getElementById('reg-phone').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const matKhau = document.getElementById('reg-pass').value;
      const confirmPass = document.getElementById('reg-pass-confirm').value;
      const errBox = document.getElementById('reg-error');
      const submitBtn = document.getElementById('btn-reg-submit');

      errBox.style.display = 'none';

      if (matKhau !== confirmPass) {
        errBox.textContent = 'Mật khẩu xác nhận không khớp!';
        errBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang tạo tài khoản...';

      try {
        await Api.register({ hoTen, soDienThoai, email, matKhau });
        alert('🎉 Đăng ký tài khoản thành viên PTIT Cinema thành công!');
        window.location.href = 'index.html';
      } catch (err) {
        errBox.textContent = err.message || 'Đăng ký không thành công!';
        errBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Tạo tài khoản';
      }
    }
  </script>
</body>
</html>
