<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danh sách phim - PTIT Cinema</title>
  <link rel="stylesheet" href="css/style.css?v=2" />
  <link rel="stylesheet" href="css/phim.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div class="container header-inner">
        <a href="index.html" class="logo">
          <div class="logo-box">
            <span class="logo-b">P</span>
            <div class="logo-text">
              <span class="logo-main">PTIT</span>
              <span class="logo-sub">CINEMA</span>
            </div>
          </div>
        </a>
        <nav class="main-nav">
          <a href="index.html#schedule-section" class="nav-link"><i class="fa-solid fa-clapperboard"></i> Lịch chiếu theo rạp</a>
          <a href="phim.html" class="nav-link active"><i class="fa-solid fa-film"></i> Phim</a>
          <a href="rap.html" class="nav-link"><i class="fa-solid fa-building"></i> Rạp</a>
          <a href="giave.html" class="nav-link"><i class="fa-solid fa-ticket"></i> Giá vé</a>
          <a href="tintuc.html" class="nav-link"><i class="fa-solid fa-newspaper"></i> Tin tức</a>
          <a href="booking-history.html" class="nav-link"><i class="fa-solid fa-clock-rotate-left"></i> Lịch sử đặt vé</a>
        </nav>
        <div class="header-actions" id="header-actions">
          <button class="btn-login" onclick="window.location.href='login.html'"><i class="fa-regular fa-user"></i> Đăng nhập</button>
          <button class="btn-register" onclick="window.location.href='register.html'">Đăng ký</button>
        </div>
      </div>
    </div>
  </header>

  <div class="page-wrapper container">
    <!-- LEFT AD -->
    <aside class="side-banner side-banner--left">
      <div class="side-ad">
        <div class="side-ad__badge">HOT</div>
        <img src="https://placehold.co/160x600/0054a6/ffffff?text=PTIT+CINEMA%0ACombo+%0ABắp+%2B+Nước%0A45.000đ" alt="Ad" class="side-ad__img" />
        <div class="side-ad__cta">Mua ngay</div>
      </div>
    </aside>

    <main class="main-content">
      <!-- Filter bar -->
      <div class="filter-bar">
        <h1 class="filter-bar__title"><i class="fa-solid fa-film"></i> Danh sách phim</h1>
        <div class="filter-bar__filters">
          <select id="filter-status" class="filter-select">
            <option value="">Tất cả</option>
            <option value="Đang chiếu" selected>Đang chiếu</option>
            <option value="Sắp chiếu">Sắp chiếu</option>
            <option value="Ngừng chiếu">Ngừng chiếu</option>
          </select>
          <input id="filter-search" type="text" placeholder="🔍 Tìm kiếm phim..." class="filter-input" />
        </div>
      </div>

      <div id="loading-spinner" class="spinner-wrap">
        <div class="spinner"></div>
        <p>Đang tải...</p>
      </div>
      <div id="error-msg" class="error-msg" style="display:none"></div>
      <div id="phim-grid" class="phim-grid" style="display:none"></div>

      <!-- Lịch chiếu của phim được chọn -->
      <section id="lich-chieu-section" style="display:none; margin-top:40px;">
        <h2 class="section-title"><i class="fa-solid fa-calendar-days"></i> Lịch chiếu: <span id="phim-selected-name"></span></h2>
        <div id="lich-chieu-list" class="schedule-list"></div>
      </section>
    </main>

    <aside class="side-banner side-banner--right">
      <div class="side-ad">
        <div class="side-ad__badge" style="background:#e53935;">MỚI</div>
        <img src="https://placehold.co/160x600/1a237e/ffffff?text=THÀNH+VIÊN%0APTIT+Plus%0AƯu+đãi+20%25" alt="Ad" class="side-ad__img" />
        <div class="side-ad__cta" style="background:#e53935;" onclick="window.location.href='register.html'">Đăng ký</div>
      </div>
    </aside>
  </div>

  <footer class="footer">
    <div class="footer-bottom">
      <p>© 2026 PTIT Cinema. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/phim.js"></script>
</body>
</html>
